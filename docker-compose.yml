version: '3.8'

services:
  # 1. PostgreSQL Database Container
  postgres_db:
    image: postgres:16-alpine
    container_name: egarrage_postgres
    restart: always
    environment:
      POSTGRES_USER: egarrage_user
      POSTGRES_PASSWORD: egarrage_pass
      POSTGRES_DB: egarrage_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U egarrage_user -d egarrage_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - egarrage_network

  # 2. Node.js Express Backend API Container
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: egarrage_backend
    restart: always
    environment:
      PORT: 5000
      POSTGRES_HOST: postgres_db
      POSTGRES_USER: egarrage_user
      POSTGRES_PASSWORD: egarrage_pass
      POSTGRES_DB: egarrage_db
      POSTGRES_PORT: 5432
    ports:
      - "5000:5000"
    depends_on:
      postgres_db:
        condition: service_healthy
    networks:
      - egarrage_network

  # 3. React + Vite + Tailwind Frontend Container
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: egarrage_frontend
    restart: always
    environment:
      VITE_API_URL: http://backend:5000
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - egarrage_network

networks:
  egarrage_network:
    driver: bridge

volumes:
  pgdata:
    driver: local
